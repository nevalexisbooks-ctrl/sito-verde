    }

    .hint-text {
      display:none; margin-top:15px;
      background:rgba(46,125,50,0.1); padding:15px; border-radius:5px;

</head>

    document.addEventListener('DOMContentLoaded', () => {
      window.history.replaceState({ page: "home" }, "", "");
      const homeDiv = document.getElementById('home');
      for (let i = 1; i <= enigmas; i++) {
        const btn = document.createElement('button');
        btn.textContent = `ENIGMA ${i}`;
        btn.className = 'enigma-button';
        btn.onclick = () => showEnigma(i);
        homeDiv.appendChild(btn);
      }
    });

    function showEnigma(n) {
      currentEnigma = n;
      document.getElementById('home').style.display = 'none';
      document.getElementById('enigmaPage').style.display = 'block';
      document.getElementById('enigmaTitle').textContent = `ENIGMA ${n}`;
      document.getElementById('digitHint').textContent =
        `La risposta è un numero a ${correctAnswers[n].length} cifre`;
      document.getElementById('answer').value = '';
      document.getElementById('result').textContent = '';
      resetHints();
      document.getElementById('solutionLink').href = solutionLinks[n];
      window.scrollTo(0, 0);
      window.history.pushState({ page: "enigma", enigma: n }, "", `#enigma${n}`);
    }

    function showHome() {
      document.getElementById('home').style.display = 'grid';
      document.getElementById('enigmaPage').style.display = 'none';
      window.history.replaceState({ page: "home" }, "", "");
    }

    window.addEventListener("popstate", e => {
      if (!e.state || e.state.page === "home") showHome();
    });

    function checkAnswer() {
      const ans = document.getElementById('answer').value.trim();
      const rd  = document.getElementById('result');
      if (ans === correctAnswers[currentEnigma]) {
        if (currentEnigma === 26) {
          rd.innerHTML = `
            <p style="color:#75b87d; margin-bottom:20px;">
              Corretto!<br>Hai risolto l'enigma!<br>Procedi con la lettura della storia!
            </p>
            <p style="color:#ffffff;">
              Hai completato l'avventura a Villa Verde, ora non ti rimane che leggere le ultime pagine per uscire dalla villa, ma prima lascia che ti ringrazi!<br><br>
              Grazie mille per aver comprato il nostro libro e per aver giocato con noi.<br><br>
              Se questi enigmi ti sono piaciuti, non dimenticare di lasciare una sincera recensione su Amazon, noi ci rivedremo presto...
            </p>`;
        } else {
          rd.innerHTML = `
            <p style="color:#75b87d;">
              Corretto!<br>Hai risolto l'enigma!<br>Procedi con la lettura della storia!
            </p>`;
        }
      } else {
        rd.textContent = 'Risposta errata. Riprova!';
        rd.style.color = '#b83838';
      }
      rd.classList.remove('shake');
      void rd.offsetWidth;
      rd.classList.add('shake');
    }

    function resetHints() {
      currentHint = 0;
      const hb = document.getElementById('hintButtons');
      hb.innerHTML = '';
      (hints[currentEnigma] || []).forEach((_, i) => {
        const b = document.createElement('button');
        b.textContent = '💡';
        b.className = `hint-button${i===0?' active':''}`;
        b.onclick = () => showHint(i+1);
        hb.appendChild(b);
      });
      document.getElementById('hintText').style.display = 'none';
    }

    function showHint(n) {
      if (n <= currentHint+1) {
        const ht = document.getElementById('hintText');
        ht.innerHTML = hints[currentEnigma][n-1];
        ht.style.display = 'block';
        if (n > currentHint) {
          currentHint = n;
          if (n < hints[currentEnigma].length) {
            document.querySelector(`.hint-button:nth-child(${n+1})`)
                    .classList.add('active');
          }
        }
      }
    }

    window.showHome    = showHome;
    window.checkAnswer = checkAnswer;
    window.showHint    = showHint;
  </script>
